name: Test and Deploy to VPS

on:
  pull_request:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']
  push:
    branches: ['master', 'main']
    paths-ignore: ['docs/**']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 2
      matrix:
        python-version: ['3.11', '3.12']
    env:
      # Réglages de test : base SQLite, clé jetable (aucun secret réel en CI)
      DJANGO_SETTINGS_MODULE: SiteDFmac.settings
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: 'False'
      DB_ENGINE: sqlite
      SECURE_SSL_REDIRECT: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run Tests
        run: python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Connexion par clé SSH avec un utilisateur dédié "deploy" (pas root),
      # et vérification de l'empreinte du serveur (secret VPS_KNOWN_HOSTS,
      # obtenu avec : ssh-keyscan -H <IP_DU_VPS>).
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy files to VPS
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.env' --exclude 'medias/' \
            --exclude 'data/' --exclude 'staticfiles/' --exclude '*.sqlite3' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:/var/www/bendingiron/

      - name: Run deployment script on VPS
        run: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} 'bash -s' < ./deploy.sh
