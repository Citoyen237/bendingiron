services:
  web:
    restart: always
    build: .
    command: "sh run.sh"
    # Accessible uniquement depuis le serveur : Nginx fait le proxy vers 127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./medias:/bendingiron/medias
      - ./staticfiles:/bendingiron/staticfiles
    env_file:
      - ".env"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    volumes:
      - ./data/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Pas de port publié : la base n'est joignable que par le réseau Docker.
    # Pour y accéder depuis ton PC : ssh -L 3306:127.0.0.1:3306 ... puis docker exec.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      retries: 5
    networks:
      - default

  # phpMyAdmin seulement à la demande, et seulement en local sur le serveur :
  #   docker compose --profile admin up -d phpmyadmin
  #   puis tunnel SSH : ssh -L 8080:127.0.0.1:8080 deploy@VPS
  phpmyadmin:
    image: phpmyadmin
    profiles: ["admin"]
    restart: "no"
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - default

networks:
  default:
